name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit and integration tests
        run: npm test

      - name: Validate prompt recipes and vendored looks
        run: npm run recipes:check

      - name: Verify vendored styles hash
        run: npm run styles:check

      - name: Check TypeScript package exports
        run: |
          npm ci
          npm run test:types

  package:
    name: package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: Verify npm tarball installs and runs cleanly
        run: |
          TARBALL="$(npm pack --silent)"
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR" "$TARBALL"' EXIT
          npm install --prefix "$TMPDIR" --no-audit --no-fund "./$TARBALL"
          "$TMPDIR/node_modules/.bin/brushrouter" --version
          "$TMPDIR/node_modules/.bin/br" --version
          "$TMPDIR/node_modules/.bin/brushrouter" prompts --mode categories > /dev/null
