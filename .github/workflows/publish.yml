name: auto-publish

# Publishes when CHANGELOG.md gains a version the npm registry doesn't have yet.
# Protocol: add a `## [x.y.z] - date` section at the top of CHANGELOG.md, push.
# Everything else — tests, package.json stamp, npm publish, git tag, GitHub
# release, version-bump commit back to main — is automatic.
#
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret exists anywhere.
# One-time setup after the first (manual, local) publish of the package:
# npmjs.com → package → Settings → Trusted publisher →
#   owner avinaxhroy, repo brushrouter, workflow filename publish.yml
# (npm's OIDC cannot publish a package's very first version — npm/cli #8544 —
#  so the bootstrap is one local `npm publish`.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release + version-bump commit
      id-token: write # OIDC claim for npm trusted publishing — replace the token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned to SHA
        with:
          persist-credentials: false # job pushes via explicit x-access-token URL; don't leak the rev token into later steps
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned to SHA
        with:
          node-version: 22
      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 ships 10.x
      - run: npm install -g npm@latest

      - name: Read newest version from CHANGELOG.md
        id: ver
        run: |
          V=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?')
          if [ -z "$V" ]; then
            echo "::error ::No '## [x.y.z]' version heading found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Newest CHANGELOG version: $V"

      - name: Gate on registry state
        id: gate
        env:
          CHANGELOG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          V="$CHANGELOG_VERSION"
          REG=$(npm view brushrouter version 2>/dev/null || true)
          if [ "$REG" = "$V" ]; then
            echo "Registry already at $V — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$REG" ]; then
            if [ "$(printf '%s\n%s\n' "$V" "$REG" | sort -V | head -1)" = "$V" ]; then
              echo "::error ::CHANGELOG version $V is not newer than published $REG — bump the version in CHANGELOG.md"
              exit 1
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.gate.outputs.skip == 'false'
        run: npm test

      - name: Stamp package.json from CHANGELOG
        if: steps.gate.outputs.skip == 'false'
        env:
          CHANGELOG_VERSION: ${{ steps.ver.outputs.version }}
        run: npm version "$CHANGELOG_VERSION" --allow-same-version --no-git-tag-version

      - name: Publish to npm (trusted publisher — OIDC, no token)
        if: steps.gate.outputs.skip == 'false'
        run: npm publish --access public

      - name: Tag, release, push version bump
        if: steps.gate.outputs.skip == 'false'
        env:
          CHANGELOG_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$CHANGELOG_VERSION"
          # release notes = the new section's body, up to the next version heading
          awk '/^## \[?v?[0-9]+/{c++; next} c==1{print}' CHANGELOG.md > release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${V} [skip ci]" || true
          git tag "v${V}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main --tags
          gh release create "v${V}" --title "v${V}" --notes-file release-notes.md
